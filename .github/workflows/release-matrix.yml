name: Release matrix

# Reproducible artifacts for every release tag. Each format is built from the
# same authoritative installer, and a final job verifies all checksums before
# the workflow is allowed to succeed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, rpm]
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget curl imagemagick dpkg-dev rpm xz-utils file

      - name: Download the authoritative installer
        run: curl -fsSL --retry 2 -o FigmaSetup.exe https://desktop.figma.com/win/FigmaSetup.exe

      - name: Build ${{ matrix.format }}
        run: ./build.sh --build ${{ matrix.format }} --clean no --exe FigmaSetup.exe

      - name: Assert tracked version and checksum artifact
        run: |
          version=$(<TRACKED_VERSION)
          shopt -s nullglob
          files=(figma-desktop-*.AppImage figma-desktop_*.deb figma-desktop-*.rpm)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do
            if [[ $file != *"$version"* ]]; then
              echo "Unexpected version in $file (expected $version)" >&2
              exit 1
            fi
          done
          sha256sum "${files[@]}" > "SHA256SUMS.${{ matrix.format }}"
          cat "SHA256SUMS.${{ matrix.format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.format }}
          path: |
            figma-desktop-*.AppImage
            figma-desktop_*.deb
            figma-desktop-*.rpm
            SHA256SUMS.${{ matrix.format }}
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksums for every format
        run: |
          cd artifacts
          for sums in SHA256SUMS.*; do
            echo "=== $sums ==="
            cat "$sums"
            sha256sum -c "$sums"
          done
